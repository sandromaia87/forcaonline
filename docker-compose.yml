services:
  app:
    image: php:8.3-cli
    container_name: forcaonline_app
    ports:
      - "8090:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=forcaonline
      - DB_USERNAME=forcaonline
      - DB_PASSWORD=secret
      - http_proxy=http://09097074:S%40n09097074dro@proxy-itaguai.mb:6060
      - https_proxy=http://09097074:S%40n09097074dro@proxy-itaguai.mb:6060
    # Instala a extensão pdo_mysql antes de rodar o artisan serve
    command: >
      sh -c "docker-php-ext-install pdo_mysql && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      - db

  db:
    image: mysql:8.4
    container_name: forcaonline_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=forcaonline
      - MYSQL_USER=forcaonline
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=secret
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
