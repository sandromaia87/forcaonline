services:
    # Contêiner da Aplicação Laravel (ForçaOnline)
    app:
        build:
            context: ./vendor/laravel/sail/runtimes/8.3
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.3/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-8000}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - forcaonline_network
        depends_on:
            db:
                condition: service_healthy # Só liga o Laravel quando o MySQL estiver 100% pronto

    # Contêiner do Banco de Dados Protegido
    db:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            # Salva os dados fisicamente no HD do servidor Docker
            - 'forcaonline_mysql_data:/var/lib/mysql'
            # Garante que scripts iniciais rodem se precisar no futuro
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - forcaonline_network
        restart: unless-stopped # Reinicia automaticamente após queda de energia do servidor físico
        stop_grace_period: 60s  # Dá 60 segundos para o MySQL salvar tudo no HD antes de desligar (evita corrupção)
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s

networks:
    forcaonline_network:
        driver: bridge

volumes:
    # Declaração do volume persistente no HD
    forcaonline_mysql_data:
        driver: local
